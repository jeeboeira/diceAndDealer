<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Formulário de login -->
  <form (ngSubmit)="login()">

    <!-- Campo de email -->
    <ion-item>
      <ion-label position="floating">Email</ion-label>
      <ion-input 
        type="email"
        [(ngModel)]="email"
        name="email"
        required>
      </ion-input>
    </ion-item>

    <!-- Campo de senha -->
    <ion-item>
      <ion-label position="floating">Senha</ion-label>
      <ion-input 
        type="password"
        [(ngModel)]="password"
        name="password"
        required>
      </ion-input>
    </ion-item>

    <!-- Botão de login -->
    <ion-button
      expand="block"
      type="submit"
      class="ion-margin-top">
      Login
    </ion-button>
  </form>
</ion-content>
