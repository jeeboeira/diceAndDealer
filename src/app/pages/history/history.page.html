<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Histórico</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let roll of rolls">
      <ion-label>
        <h2>Valor: {{ roll.value }}</h2>
        <p>{{ roll.rolledAt | date:'short' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
